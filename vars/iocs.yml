# Names are leads only; validate exact file hashes/signatures from trusted intel.
artex_tool_name_patterns:
  - '\bartex(?:[-_ ]?pro)?\b'
  - '\b(bloodalchemy|wisp|vshell|adaptixc2|cliproxyapi|new[ _-]?api)\b'

artex_llm_api_domains:
  - api.anthropic.com
  - api.deepseek.com
  - open.bigmodel.cn
  - api.x.ai

artex_suspicious_webshell_extensions:
  - .aspx
  - .jsp

artex_linux_paths:
  - /opt/artex
  - /usr/local/bin/artex
  - /usr/bin/artex
  - /var/lib/artex

artex_windows_paths:
  - C:\\ProgramData\\Artex
  - C:\\Windows\\Temp\\artex
  - C:\\Program Files\\Artex


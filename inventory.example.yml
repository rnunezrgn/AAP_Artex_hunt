all:
  children:
    linux:
      hosts:
        rhel-example:
          ansible_host: 192.0.2.10
          artex_platform: linux
    windows:
      hosts:
        win-example:
          ansible_host: 192.0.2.20
          artex_platform: windows
    kubernetes_api:
      hosts:
        cluster-api:
          ansible_connection: local
          artex_platform: kubernetes
          artex_k8s_namespaces: [default, production]
    azure_audit:
      hosts:
        azure-log-batch:
          ansible_connection: local
          artex_platform: azure
          artex_azure_audit_records: []
